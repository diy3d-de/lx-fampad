name: lx_fampad
description: "lx-fampad: Familien-App (Android und Web)"
publish_to: 'none'

# Versionsnummer = Update-Vergleich (Android-OTA, /api/v1/version). Build-Nummer = versionCode.
version: 0.14.0+14000

# Versionen sind exakt gepinnt (docs/VERSIONEN.md), kein ^ und keine Bereiche.
environment:
  sdk: 3.13.5
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  drift: 2.35.1
  drift_flutter: 0.3.1
  http: 1.6.0
  crypto: 3.0.7
  path_provider: 2.1.6
  intl: 0.20.3
  # Ed25519-Prüfung des Update-Manifests (reines Dart, läuft auch im Web)
  cryptography: 2.9.0
  # an sqlite3.wasm gebunden (web/sqlite3.wasm, Prüfsumme in docs/VERSIONEN.md): beide immer zusammen ändern
  sqlite3: 3.7.0
  flutter_secure_storage: 11.2.0
  passkeys: 2.23.1
  mobile_scanner: 7.4.2
  qr_flutter: 4.1.0
  sodium: 4.1.1+2
  web: 1.1.1
  # WebSocket-Client für den Revisionshinweis des Sync (Reconnect mit Backoff baut data/sync/sync_socket.dart selbst)
  web_socket_channel: 3.0.3
  # Terminserien: rrule expandiert (rechnet ohne Zeitzonen, siehe data/calendar/expansion.dart), timezone liefert die Zeitzonen-Daten (Sommerzeit)
  rrule: 0.2.18
  timezone: 0.11.1
  # ICS-Import: Dateiauswahl über den System-Picker (Android ohne Speicherberechtigung, Web: Browser-Dialog)
  file_picker: 13.1.0
  # Lokale Terminerinnerungen (nur Android; Web bekommt keine). 22.3.2 (12.10.2026) war zum Stichtag jünger als 14 Tage
  flutter_local_notifications: 22.3.1
  # Push: UnifiedPush (ntfy-App als Verteiler, kein Google), nur Android; unifiedpush_android pinnt die native Seite
  unifiedpush: 6.2.0
  unifiedpush_android: 3.4.1
  # Karte ohne Fremd-Anbieter (Spike, docs/KARTE-SPIKE.md): MapLibre, Kacheln als PMTiles vom eigenen Server
  maplibre: 0.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.1
  # analyzer 14.5.0 ist zu jung (Regel: mind. 14 Tage) und bricht build_runner 2.16.1: bis auf Weiteres festhalten
  analyzer: 14.4.0

# Transitive Pakete von file_picker auf Stände festhalten, die mindestens 14 Tage alt sind (Regel für neue Pakete)
# (Versionen und Veröffentlichungsdaten: docs/VERSIONEN.md). Wiedervorlage 19.11.2026: dann sind die neueren Stände 14 Tage alt, Overrides prüfen und entfernen.
dependency_overrides:
  # archive (nur vom Werkzeug sodium:update_web genutzt): 4.5.2 ist zu jung (Regel: mind. 14 Tage), sodium verlangt ^4.3.0
  archive: 4.3.0
  android_file_picker: 2.0.0
  file_picker_darwin: 2.1.2
  file_picker_linux: 2.0.1
  file_picker_platform_interface: 4.0.0
  file_picker_web: 4.0.0
  windows_file_picker: 2.0.0
  petitparser: 7.0.2
  xml: 7.0.1
  # unifiedpush 6.2.0 zieht unifiedpush_linux (dbus ^0.7.11), file_picker_linux 2.0.1 braucht dbus ^0.8.0; Linux wird nie gebaut (nur Android + Web),
  # der Linux-Code beider Pakete wird nicht übersetzt: der Override löst nur den Versionskonflikt (dbus 0.8.0 vom 16.09.2026, ohnehin im Lockfile)
  dbus: 0.8.0
  # maplibre_ios 0.3.6 verlangt code_assets ^1.0.0, sodium 4.1.1+2 verlangt ^2.1.0. maplibre_ios wird nur für iOS gebaut (nie von uns; sein Build-Hook kehrt
  # für alle anderen Zielsysteme sofort zurück), der Override löst nur den Versionskonflikt zugunsten von sodium (docs/VERSIONEN.md)
  code_assets: 2.1.0

flutter:
  uses-material-design: true

  # Zeitzonen-Daten (timezone 0.11.1, latest.tzf) für Terminserien, von der eigenen Domain (Prüfsumme in docs/VERSIONEN.md)
  assets:
    - assets/tz/latest.tzf
    # Karten-Stil (Protomaps, dunkel; Spike docs/KARTE-SPIKE.md), erzeugt von tools/karte/make-style.mjs
    - assets/karte/style.json
    - assets/karte/style-hell.json
    # Platzhalter-Benutzerbilder (transparente PNG, Quellen in tool/avatare/)
    - assets/avatare/
    # Schulferien Rheinland-Pfalz 2026-2029 (mitgeliefert, ohne Netzabruf; Quelle im Dateikopf)
    - assets/kalender/schulferien_rlp.json
    # Wortliste für Passwort-Vorschläge (BIP-39 englisch, MIT; Quelle im Dateikopf)
    - assets/crypto/wortliste.txt
    # Neuigkeiten je Version (Dialog nach einem Update, ohne Netzabruf)
    - assets/neuigkeiten.json

  # Schriften werden mitgeliefert (SIL Open Font License, Lizenztexte liegen daneben) - kein Google-Fonts-Abruf.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
