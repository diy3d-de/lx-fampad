name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (Lint, Typen, Tests, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Echtes PostgreSQL 17 für den Schema-Test (zusätzlich zu PGlite)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  tools:
    name: Werkzeuge (Manifest-Signatur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: node --test "tools/*.test.mjs"

  app:
    name: App (analyze, test, Web-Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      # pubspec.lock ist eingecheckt: die CI darf nichts neu auflösen (analyzer 14.5.0 bricht build_runner 2.16.1)
      - run: flutter pub get --enforce-lockfile
      # eingecheckte Binärdateien des Webs prüfen (sqlite3.wasm passend zu sqlite3 3.7.0, drift_worker.js)
      - name: Prüfsummen web/sqlite3.wasm und web/drift_worker.js
        run: |
          sha256sum -c web-assets.sha256
          # dieselben Werte müssen in docs/VERSIONEN.md stehen
          for h in $(cut -d' ' -f1 web-assets.sha256); do grep -q "$h" ../docs/VERSIONEN.md; done
      # erzeugt lib/data/app_database.g.dart (drift), die Datei ist nicht eingecheckt (sauberer Checkout: keine Altlasten)
      - run: dart run build_runner build
      - run: flutter analyze
      # libsodium (Build-Hook) muss in der CI laden: sonst würden die Kryptotests still übersprungen
      - run: flutter test
        env:
          SODIUM_ERFORDERLICH: '1'
      - run: flutter build web --release --no-web-resources-cdn
      - name: Gebaute Web-Binärdateien sind die geprüften
        run: sed -E 's# (\*?)web/# \1build/web/#' web-assets.sha256 | sha256sum -c

  android-debug:
    name: Android (Debug-APK bauen)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Speicherplatz: NDK-Download, libsodium-Build für alle ABIs und die APK füllen die Platte des Runners ("No space left on device"); ungenutzte Vorinstallationen entfernen
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/27* /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/.ghcup && df -h /
        working-directory: .
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      # Android-SDK ist auf dem Runner vorinstalliert; nur die Lizenzen bestätigen
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        working-directory: .
      # Gradle-Cache (nur Abhängigkeiten und Wrapper; NDK/CMake bewusst nicht, die Platte ist knapp)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      # Debug-APK ist mit dem Debug-Schlüssel signiert und wird nicht veröffentlicht; prüft nur, dass der Android-Build läuft
      - run: flutter build apk --debug
      # Release-Build mit Wegwerf-Schlüssel (nie verteilt): R8 läuft nur hier, nicht im Debug-Build. Fängt z. B. die leere Karte von v0.5.0 (R8 entfernte Methoden der
      # PlatformView-Schnittstelle, die die Karte per JNI benutzt) und prüft das Release-Manifest (INTERNET da, kein Standort im Hintergrund)
      - run: bash tools/release-pruefung.sh
        working-directory: .
