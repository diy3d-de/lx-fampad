<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Anmeldung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#090A0F}
a{color:#00F0FF;text-decoration:none}a:hover{color:#E6E8EE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 24px 32px; overflow: hidden; background-color: #090A0F; background-image: radial-gradient(ellipse 60% 380px at 30% 0, rgba(124,58,237,0.22), transparent 70%), radial-gradient(ellipse 45% 300px at 70% 0, rgba(0,240,255,0.07), transparent 70%); background-repeat: no-repeat; color: #E6E8EE; font-family: Inter, ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
    <div style="width: 72px; height: 72px; border-radius: 22px; border: 1px solid #242936; background: radial-gradient(circle at 30% 20%, rgba(124,58,237,0.7), rgba(0,240,255,0.25) 70%), #13161F; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color: #00F0FF; letter-spacing: -0.03em;">lx</div>
    <div style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em;"><span style="color: #00F0FF;">lx</span>-fampad</div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8B93A7;">// eure familie. euer server.</div>
  </div>

  <sc-if value="{{ stepOne }}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.025em;">Willkommen zurück</h1>
    <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; border-radius: 12px; background: #00F0FF; color: #090A0F; font-size: 16px; font-weight: 700; box-shadow: 0 0 20px rgba(0,240,255,0.25);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/></svg>Mit Passkey anmelden</a>
    <div style="display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B93A7;"><span style="flex: 1; height: 1px; background: #242936;"></span>oder mit passwort<span style="flex: 1; height: 1px; background: #242936;"></span></div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #8B93A7;">E-Mail
      <input type="email" value="anna@beispiel.de" style="min-height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #242936; background: rgba(9,10,15,0.6); color: #E6E8EE; font-family: 'JetBrains Mono', monospace; font-size: 15px;">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #8B93A7;">Passwort
      <input type="password" value="geheimespasswort" style="min-height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #00F0FF; box-shadow: 0 0 0 3px rgba(0,240,255,0.18); background: rgba(9,10,15,0.6); color: #E6E8EE; font-family: 'JetBrains Mono', monospace; font-size: 15px;">
    </label>
    <button type="button" onClick="{{ next }}" style="min-height: 48px; border-radius: 12px; border: 1px solid #242936; background: rgba(19,22,31,0.8); color: #E6E8EE; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">Weiter</button>
  </div>
  </sc-if>

  <sc-if value="{{ stepTwo }}" hint-placeholder-val="{{ false }}">
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid rgba(124,58,237,0.5); background: rgba(124,58,237,0.1); padding: 2px 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #C4B5FD;">schritt 2 von 2</span>
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.025em;">Bestätigungscode</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #8B93A7;">Gib den 6-stelligen Code aus deiner Authenticator-App ein.</p>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;">
      <input aria-label="Ziffer 1" inputmode="numeric" maxlength="1" value="4" style="min-height: 56px; min-width: 0; border-radius: 10px; border: 1px solid #242936; background: #13161F; color: #00F0FF; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 22px;">
      <input aria-label="Ziffer 2" inputmode="numeric" maxlength="1" value="8" style="min-height: 56px; min-width: 0; border-radius: 10px; border: 1px solid #242936; background: #13161F; color: #00F0FF; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 22px;">
      <input aria-label="Ziffer 3" inputmode="numeric" maxlength="1" value="1" style="min-height: 56px; min-width: 0; border-radius: 10px; border: 1px solid #242936; background: #13161F; color: #00F0FF; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 22px;">
      <input aria-label="Ziffer 4" inputmode="numeric" maxlength="1" value="" style="min-height: 56px; min-width: 0; border-radius: 10px; border: 1px solid #00F0FF; box-shadow: 0 0 0 3px rgba(0,240,255,0.18); background: #13161F; color: #00F0FF; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 22px;">
      <input aria-label="Ziffer 5" inputmode="numeric" maxlength="1" value="" style="min-height: 56px; min-width: 0; border-radius: 10px; border: 1px solid #242936; background: #13161F; color: #00F0FF; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 22px;">
      <input aria-label="Ziffer 6" inputmode="numeric" maxlength="1" value="" style="min-height: 56px; min-width: 0; border-radius: 10px; border: 1px solid #242936; background: #13161F; color: #00F0FF; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 22px;">
    </div>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px;"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #00F0FF;">Diesem Gerät 30 Tage vertrauen</label>
    <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: #00F0FF; color: #090A0F; font-size: 16px; font-weight: 700;">Anmelden</a>
    <div style="display: flex; justify-content: space-between; font-size: 13px;">
      <button type="button" onClick="{{ back }}" style="min-height: 44px; border: 0; background: transparent; color: #8B93A7; font: inherit; font-size: 13px; cursor: pointer; padding: 0;">← zurück</button>
      <a href="#" style="display: inline-flex; align-items: center; min-height: 44px;">Wiederherstellungscode nutzen</a>
    </div>
  </div>
  </sc-if>

  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
    <a href="#" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v7h-4M14 21v-3"/></svg>Einladung per QR-Code annehmen</a>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B93A7;"><span style="color: #10B981;">●</span> familie.lx-labs.dev · tls 1.3</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { step: 1 };
}
renderVals() {
return {
stepOne: this.state.step === 1,
stepTwo: this.state.step === 2,
next: () => this.setState({ step: 2 }),
back: () => this.setState({ step: 1 })
};
}
}
</script>
</body>
</html>
