<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#090A0F}
a{color:#00F0FF;text-decoration:none}a:hover{color:#E6E8EE}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: radial-gradient(ellipse 60% 380px at 30% 0, rgba(124,58,237,0.22), transparent 70%), radial-gradient(ellipse 45% 300px at 70% 0, rgba(0,240,255,0.07), transparent 70%), #090A0F; background-repeat: no-repeat; color: #E6E8EE; font-family: Inter, ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="flex: none; box-sizing: border-box; padding: 52px 16px 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #242936; background: rgba(19,22,31,0.85);">
    <a href="Home.dc.html" aria-label="Zurück" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #E6E8EE;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div style="display: flex;">
      <span style="width: 30px; height: 30px; border-radius: 999px; border: 2px solid #00F0FF; background: #13161F; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;">A</span>
      <span style="width: 30px; height: 30px; margin-left: -10px; border-radius: 999px; border: 2px solid #C4B5FD; background: #13161F; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;">B</span>
      <span style="width: 30px; height: 30px; margin-left: -10px; border-radius: 999px; border: 2px solid #10B981; background: #13161F; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;">M</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 16px; font-weight: 700;">Familie</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #10B981;">● 3 von 4 online</span>
    </div>
    <button type="button" aria-label="Im Chat suchen" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #242936; background: transparent; color: #E6E8EE; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  </header>

  <div style="flex: none; display: flex; gap: 8px; padding: 10px 16px; overflow: hidden; border-bottom: 1px solid #242936;">
    <span style="flex: none; border-radius: 999px; border: 1px solid #00F0FF; background: rgba(0,240,255,0.1); color: #00F0FF; padding: 6px 12px; font-size: 13px; font-weight: 600;">Familie</span>
    <span style="flex: none; border-radius: 999px; border: 1px solid #242936; padding: 6px 12px; font-size: 13px;">Eltern</span>
    <span style="flex: none; border-radius: 999px; border: 1px solid #242936; padding: 6px 12px; font-size: 13px;">Ben</span>
    <span style="flex: none; border-radius: 999px; border: 1px solid #242936; padding: 6px 12px; font-size: 13px;">Oma &amp; Opa</span>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px;">
    <div style="align-self: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B93A7;">heute</div>
    <sc-for list="{{ msgs }}" as="m" hint-placeholder-count="5">
      <div style="{{ m.row }}">
        <sc-if value="{{ m.other }}" hint-placeholder-val="{{ true }}">
          <span style="{{ m.avatar }}">{{ m.initial }}</span>
        </sc-if>
        <div style="{{ m.bubble }}">
          <sc-if value="{{ m.other }}" hint-placeholder-val="{{ true }}">
            <span style="font-size: 12px; font-weight: 600; color: #8B93A7;">{{ m.name }}</span>
          </sc-if>
          <sc-if value="{{ m.hasFile }}" hint-placeholder-val="{{ false }}">
            <span style="display: flex; align-items: center; gap: 10px; border-radius: 10px; border: 1px solid #242936; background: #090A0F; padding: 8px 10px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px;">{{ m.file }}</span></span>
          </sc-if>
          <span style="font-size: 15px; line-height: 1.45;">{{ m.text }}</span>
          <span style="align-self: flex-end; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8B93A7;">{{ m.time }}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 12px 30px; border-top: 1px solid #242936; background: rgba(19,22,31,0.95);">
    <button type="button" aria-label="Datei anhängen" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #242936; background: transparent; color: #8B93A7; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11l-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/></svg></button>
    <label style="flex: 1; min-width: 0; display: flex;">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Nachricht</span>
      <input type="text" value="{{ draft }}" onChange="{{ type }}" placeholder="Nachricht …" style="flex: 1; min-width: 0; min-height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #242936; background: #090A0F; color: #E6E8EE; font: inherit; font-size: 15px;">
    </label>
    <button type="button" onClick="{{ send }}" aria-label="Senden" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #00F0FF; color: #090A0F; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2-6z"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = {
draft: '',
msgs: [
{ who: 'b', text: 'Ich hole Leo um 17:30 vom Training ab.', time: '08:12' },
{ who: 'm', text: 'Kann jemand meine Schwimmbrille einpacken?', time: '08:20' },
{ who: 'a', text: 'Liegt schon in deiner Tasche.', time: '08:22' },
{ who: 'l', text: 'Ist das richtige Trikot?', time: '08:31', file: 'trikot.jpg · 1,2 mb' },
{ who: 'a', text: 'Ja, das blaue. Danke!', time: '08:33' }
]
};
}
renderVals() {
var P = { a: ['Anna', '#00F0FF'], b: ['Ben', '#C4B5FD'], m: ['Mia', '#10B981'], l: ['Leo', '#FEBC2E'] };
var self = this;
var msgs = this.state.msgs.map(function (m) {
var me = m.who === 'a';
return {
other: !me,
name: P[m.who][0],
initial: P[m.who][0].charAt(0),
text: m.text,
time: m.time + (me ? ' ✓✓' : ''),
hasFile: !!m.file,
file: m.file || '',
row: 'display: flex; gap: 8px; align-items: flex-end; ' + (me ? 'justify-content: flex-end;' : ''),
avatar: 'flex: none; width: 28px; height: 28px; border-radius: 999px; border: 2px solid ' + P[m.who][1] + '; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;',
bubble: 'max-width: 260px; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 14px; ' + (me ? 'border: 1px solid rgba(0,240,255,0.35); background: rgba(0,240,255,0.1); border-bottom-right-radius: 4px;' : 'border: 1px solid #242936; background: #13161F; border-bottom-left-radius: 4px;')
};
});
return {
msgs: msgs.slice(-6),
draft: this.state.draft,
type: function (e) { self.setState({ draft: e.target.value }); },
send: function () {
var t = self.state.draft.trim();
if (!t) return;
self.setState({ draft: '', msgs: self.state.msgs.concat([{ who: 'a', text: t, time: '08:40' }]) });
}
};
}
}
</script>
</body>
</html>
